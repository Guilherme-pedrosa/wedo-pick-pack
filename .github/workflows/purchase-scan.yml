name: Atualizar compras incluindo saldos de baixas parciais
on:
  workflow_dispatch:
  schedule:
    # Verifica a cada hora fora do pico; o worker só varre se o último sucesso
    # tiver pelo menos 3h. Uma janela perdida não espera outras três horas.
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: purchase-scan-production
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Conferir necessidades e atualizar a lista
        run: node scripts/purchase-scan-worker.mjs
        env:
          PARTIAL_EXECUTION_TOKEN: ${{ secrets.PARTIAL_EXECUTION_TOKEN }}
          PURCHASE_SCAN_FORCE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
